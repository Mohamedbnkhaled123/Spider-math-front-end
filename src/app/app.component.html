<div class="min-h-screen flex flex-col bg-chalkboard-math-layer text-text-primary selection:bg-brand-primary selection:text-white transition-colors duration-200">
  <!-- Unified Global Brand Header -->
  <app-brand-header class="sticky top-0 z-50 block w-full"></app-brand-header>

  <!-- Main View Container -->
  <main class="flex-1 flex flex-col">
    <router-outlet></router-outlet>
  </main>

  <!-- Unified Global Brand Footer (Deferred on Viewport) -->
  @defer (on viewport; prefetch on idle) {
    <app-brand-footer></app-brand-footer>
  } @placeholder {
    <div class="min-h-[140px] pt-10"></div>
  }
</div>
