<div class="min-h-screen flex flex-col bg-chalkboard-math-layer text-text-primary selection:bg-brand-primary selection:text-white transition-colors duration-200 relative overflow-x-clip">

  <!-- Global Atmospheric Floating Math Symbols Layer (Rendered Across All Pages & Screens, Suppressed on Exam/Quiz/Homework Pages) -->
  @if (!isExamOrQuizPage()) {
    <div class="global-floating-math-layer fixed inset-0 pointer-events-none overflow-hidden select-none z-0" aria-hidden="true">
      <span class="floating-math-symbol absolute top-12 left-[5%] text-2xl sm:text-5xl font-black text-brand-violet/25 dark:text-purple-400/25 animate-float-math" style="animation-delay: 0s;">π</span>
      <span class="floating-math-symbol absolute top-20 right-[7%] text-2xl sm:text-6xl font-black text-brand-violet/25 dark:text-purple-400/25 animate-float-math" style="animation-delay: 1.6s;">Σ</span>
      <span class="floating-math-symbol absolute bottom-20 left-[6%] text-3xl sm:text-6xl font-black text-brand-violet/25 dark:text-purple-400/25 animate-float-math-slow" style="animation-delay: 3.2s;">∞</span>
      <span class="floating-math-symbol absolute bottom-24 right-[8%] text-2xl sm:text-5xl font-black text-brand-violet/25 dark:text-purple-400/25 animate-float-math" style="animation-delay: 2.1s;">√</span>
      <span class="floating-math-symbol absolute top-1/2 left-[3%] text-xl sm:text-4xl font-bold text-brand-violet/25 dark:text-purple-400/25 animate-float-math-slow" style="animation-delay: 4s;">Δ</span>
      <span class="floating-math-symbol absolute bottom-1/3 left-[16%] text-xl sm:text-3xl font-serif text-brand-violet/20 dark:text-purple-400/20 animate-float-math" style="animation-delay: 2.8s;">∫</span>
      <span class="floating-math-symbol absolute top-2/3 right-[14%] text-xl sm:text-3xl font-serif text-brand-violet/20 dark:text-purple-400/20 animate-float-math-slow" style="animation-delay: 1.1s;">θ</span>
      <span class="floating-math-symbol absolute top-1/4 right-[25%] text-lg sm:text-2xl font-mono text-brand-violet/20 dark:text-purple-400/20 animate-float-math" style="animation-delay: 3.7s;">λ</span>
      <span class="floating-math-symbol absolute bottom-1/4 right-[4%] text-lg sm:text-2xl font-mono text-brand-violet/20 dark:text-purple-400/20 animate-float-math-slow" style="animation-delay: 2.4s;">α</span>
      <span class="floating-math-symbol absolute top-1/3 left-[20%] text-lg sm:text-2xl font-mono text-brand-violet/20 dark:text-purple-400/20 animate-float-math" style="animation-delay: 0.8s;">β</span>
      <span class="floating-math-symbol absolute top-[75%] left-[28%] text-base sm:text-xl font-mono text-brand-violet/20 dark:text-purple-400/20 animate-float-math-slow" style="animation-delay: 4.5s;">f(x)</span>
      <span class="floating-math-symbol absolute top-[14%] left-[45%] text-base sm:text-xl font-mono text-brand-violet/20 dark:text-purple-400/20 animate-float-math" style="animation-delay: 2.9s;">x²</span>
    </div>
  }

  <!-- Unified Global Brand Header -->
  <app-brand-header class="sticky top-0 z-50 block w-full"></app-brand-header>

  <!-- Main View Container (min-h-screen keeps footer below the fold while route chunk mounts, eliminating CLS) -->
  <main class="flex-1 flex flex-col relative z-10 min-h-screen">
    <router-outlet></router-outlet>
  </main>

  <!-- Unified Global Brand Footer (Deferred on Viewport) -->
  @defer (on viewport) {
    <app-brand-footer class="relative z-10"></app-brand-footer>
  } @placeholder {
    <div class="min-h-[140px] pt-10"></div>
  }

  <!-- Global Confirmation Dialog (Deferred until opened) -->
  @if (confirmDialogService.state().isOpen) {
    @defer (when confirmDialogService.state().isOpen) {
      <app-confirm-dialog></app-confirm-dialog>
    }
  }
</div>
