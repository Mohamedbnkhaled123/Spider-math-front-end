<div class="min-h-screen flex flex-col bg-spider-coordinate-grid text-text-primary selection:bg-brand-secondary selection:text-white transition-colors duration-200">
  <!-- Unified Global Brand Header -->
  <app-brand-header></app-brand-header>

  <!-- Main View Container -->
  <main class="flex-1 flex flex-col">
    <router-outlet></router-outlet>
  </main>

  <!-- Unified Global Brand Footer (Deferred on Viewport) -->
  @defer (on viewport; prefetch on idle) {
    <app-brand-footer></app-brand-footer>
  } @placeholder {
    <div class="min-h-[350px] border-t border-surface-border bg-surface-secondary/40"></div>
  }
</div>
