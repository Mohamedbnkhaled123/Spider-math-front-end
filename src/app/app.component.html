<div class="min-h-screen flex flex-col bg-chalkboard-math-layer text-text-primary selection:bg-brand-primary selection:text-white transition-colors duration-200 relative overflow-x-clip">

  <!-- Global Atmospheric Floating Math Symbols Layer (Rendered Across All Pages & Screens, Rising Continuously from Bottom to Top) -->
  @if (!isExamOrQuizPage()) {
    <div class="global-floating-math-layer fixed inset-0 pointer-events-none overflow-hidden select-none z-0" aria-hidden="true">
      <span class="floating-math-symbol absolute left-[5%] text-2xl sm:text-5xl font-black text-brand-violet/30 dark:text-purple-400/30 animate-float-math" style="animation-delay: 0s;">π</span>
      <span class="floating-math-symbol absolute right-[8%] text-2xl sm:text-6xl font-black text-brand-violet/30 dark:text-purple-400/30 animate-float-math-slow" style="animation-delay: -5s;">Σ</span>
      <span class="floating-math-symbol absolute left-[14%] text-3xl sm:text-6xl font-black text-brand-violet/30 dark:text-purple-400/30 animate-float-math" style="animation-delay: -11s;">∞</span>
      <span class="floating-math-symbol absolute right-[18%] text-2xl sm:text-5xl font-black text-brand-violet/30 dark:text-purple-400/30 animate-float-math-slow" style="animation-delay: -17s;">√</span>
      <span class="floating-math-symbol absolute left-[26%] text-xl sm:text-4xl font-bold text-brand-violet/30 dark:text-purple-400/30 animate-float-math" style="animation-delay: -8s;">Δ</span>
      <span class="floating-math-symbol absolute left-[38%] text-xl sm:text-4xl font-serif text-brand-violet/25 dark:text-purple-400/25 animate-float-math-slow" style="animation-delay: -22s;">∫</span>
      <span class="floating-math-symbol absolute right-[28%] text-xl sm:text-3xl font-serif text-brand-violet/25 dark:text-purple-400/25 animate-float-math" style="animation-delay: -14s;">θ</span>
      <span class="floating-math-symbol absolute right-[38%] text-lg sm:text-2xl font-mono text-brand-violet/25 dark:text-purple-400/25 animate-float-math-slow" style="animation-delay: -3s;">λ</span>
      <span class="floating-math-symbol absolute right-[4%] text-lg sm:text-2xl font-mono text-brand-violet/25 dark:text-purple-400/25 animate-float-math" style="animation-delay: -9s;">α</span>
      <span class="floating-math-symbol absolute left-[48%] text-lg sm:text-2xl font-mono text-brand-violet/25 dark:text-purple-400/25 animate-float-math-slow" style="animation-delay: -19s;">β</span>
      <span class="floating-math-symbol absolute left-[62%] text-base sm:text-xl font-mono text-brand-violet/25 dark:text-purple-400/25 animate-float-math" style="animation-delay: -12s;">f(x)</span>
      <span class="floating-math-symbol absolute right-[50%] text-base sm:text-xl font-mono text-brand-violet/25 dark:text-purple-400/25 animate-float-math-slow" style="animation-delay: -25s;">x²</span>
    </div>
  }

  <!-- Unified Global Brand Header -->
  <app-brand-header class="sticky top-0 z-50 block w-full"></app-brand-header>

  <!-- Main View Container (min-h-screen keeps footer below the fold while route chunk mounts, eliminating CLS) -->
  <main class="flex-1 flex flex-col relative z-10 min-h-screen">
    @if (isRouteNavigating()) {
      <app-route-skeleton-loader [targetUrl]="navigatingUrl()" class="w-full"></app-route-skeleton-loader>
    }
    <div [class.hidden]="isRouteNavigating()" class="flex-1 flex flex-col">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Unified Global Brand Footer (Deferred on Viewport) -->
  @defer (on viewport) {
    <app-brand-footer class="relative z-10"></app-brand-footer>
  } @placeholder {
    <div class="min-h-[140px] pt-10"></div>
  }

  <!-- Global Confirmation Dialog (Deferred until opened) -->
  @if (confirmDialogService.state().isOpen) {
    @defer (when confirmDialogService.state().isOpen) {
      <app-confirm-dialog></app-confirm-dialog>
    }
  }
</div>
