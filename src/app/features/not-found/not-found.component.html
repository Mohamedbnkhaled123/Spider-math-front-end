<div class="min-h-[70vh] flex items-center justify-center px-4 py-16 text-center">
  <div class="max-w-md w-full">
    <div class="text-7xl font-black text-brand-primary dark:text-blue-400 mb-4 tracking-tighter">
      404
    </div>
    <h2 class="text-2xl font-bold mb-2">
      {{ langService.isArabic() ? 'الصفحة غير موجودة' : 'Page Not Found' }}
    </h2>
    <p class="text-sm text-text-secondary mb-8">
      {{ langService.isArabic() ? 'عذراً، الصفحة التي تبحث عنها غير متوفرة أو تم نقلها.' : 'Sorry, the requested educational resource could not be found.' }}
    </p>
    <a
      routerLink="/"
      class="inline-flex items-center gap-2 px-6 py-3 rounded-xl font-bold text-white bg-brand-primary hover:bg-brand-primary/90 transition-colors shadow-md"
    >
      <app-icon name="home" [size]="18" />
      <span>{{ 'NAV.HOME' | transloco }}</span>
    </a>
  </div>
</div>
