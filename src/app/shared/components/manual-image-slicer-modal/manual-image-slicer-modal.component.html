@if (isOpen()) {
  <div
    class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-slate-950/80 backdrop-blur-md animate-fade-in"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="modalTitle()"
  >
    <div
      class="modal-window flex flex-col w-full max-w-4xl max-h-[92vh] rounded-2xl bg-slate-900 border border-amber-500/30 shadow-2xl overflow-hidden animate-scale-up"
    >
      <!-- Modal Header -->
      <header class="flex items-center justify-between px-5 py-3.5 bg-slate-950/70 border-b border-amber-500/20 text-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-400 flex items-center justify-center">
            <app-icon name="image" [size]="18" />
          </div>
          <div>
            <h3 class="text-sm sm:text-base font-bold text-amber-300">{{ modalTitle() }}</h3>
            <p class="text-[11px] text-slate-400">حدد السؤال أو الرسم الهندسي بدقة متناهية</p>
          </div>
        </div>

        <button
          type="button"
          (click)="cancelCrop()"
          class="p-1.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition-colors"
          title="إغلاق"
        >
          <app-icon name="x" [size]="20" />
        </button>
      </header>

      <!-- Interactive Toolbar -->
      <section class="flex flex-wrap items-center justify-between gap-2.5 px-4 py-2 bg-slate-950/40 border-b border-slate-800 text-xs text-slate-300">
        <!-- Rotation & Reset -->
        <div class="flex items-center gap-1.5">
          <button
            type="button"
            (click)="rotateLeft()"
            class="tool-btn px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-amber-500/20 hover:text-amber-300 border border-slate-700/60 transition-all flex items-center gap-1"
            title="تدوير لليسار 90°"
          >
            <app-icon name="rotate-ccw" [size]="14" />
            <span class="hidden sm:inline">تدوير 90°</span>
          </button>

          <button
            type="button"
            (click)="rotateRight()"
            class="tool-btn px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-amber-500/20 hover:text-amber-300 border border-slate-700/60 transition-all flex items-center gap-1"
            title="تدوير لليمين 90°"
          >
            <app-icon name="rotate-cw" [size]="14" />
          </button>

          <button
            type="button"
            (click)="resetCrop()"
            class="tool-btn px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 transition-all"
            title="إعادة ضبط القص"
          >
            إعادة ضبط
          </button>
        </div>

        <!-- Aspect Ratio Selection -->
        <div class="flex items-center gap-1 bg-slate-800/80 rounded-lg p-0.5 border border-slate-700/60">
          <button
            type="button"
            (click)="setAspectRatio('FREE')"
            class="px-2 py-0.5 rounded text-[11px] font-semibold transition-colors"
            [class.bg-amber-500]="currentAspectRatio() === 'FREE'"
            [class.text-slate-950]="currentAspectRatio() === 'FREE'"
            [class.text-slate-300]="currentAspectRatio() !== 'FREE'"
          >
            حر
          </button>

          <button
            type="button"
            (click)="setAspectRatio('16:9')"
            class="px-2 py-0.5 rounded text-[11px] font-semibold transition-colors"
            [class.bg-amber-500]="currentAspectRatio() === '16:9'"
            [class.text-slate-950]="currentAspectRatio() === '16:9'"
            [class.text-slate-300]="currentAspectRatio() !== '16:9'"
          >
            16:9
          </button>

          <button
            type="button"
            (click)="setAspectRatio('4:3')"
            class="px-2 py-0.5 rounded text-[11px] font-semibold transition-colors"
            [class.bg-amber-500]="currentAspectRatio() === '4:3'"
            [class.text-slate-950]="currentAspectRatio() === '4:3'"
            [class.text-slate-300]="currentAspectRatio() !== '4:3'"
          >
            4:3
          </button>

          <button
            type="button"
            (click)="setAspectRatio('1:1')"
            class="px-2 py-0.5 rounded text-[11px] font-semibold transition-colors"
            [class.bg-amber-500]="currentAspectRatio() === '1:1'"
            [class.text-slate-950]="currentAspectRatio() === '1:1'"
            [class.text-slate-300]="currentAspectRatio() !== '1:1'"
          >
            1:1
          </button>
        </div>

        <!-- Zoom & Size Indicator -->
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1 bg-slate-800/80 rounded-lg p-0.5 border border-slate-700/60">
            <button
              type="button"
              (click)="zoomOut()"
              class="px-2 py-0.5 rounded hover:bg-slate-700"
              title="تصغير"
            >
              -
            </button>
            <button
              type="button"
              (click)="zoomIn()"
              class="px-2 py-0.5 rounded hover:bg-slate-700"
              title="تكبير"
            >
              +
            </button>
          </div>

          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-mono font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
            ~{{ approxSizeKb() }} KB WebP
          </span>
        </div>
      </section>

      <!-- Cropper Viewport -->
      <main class="cropper-viewport relative flex-1 w-full min-h-[320px] max-h-[62vh] overflow-hidden bg-slate-950 flex items-center justify-center">
        @if (!isCropperReady()) {
          <div class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-sm">
            <div class="w-8 h-8 border-3 border-amber-400/30 border-t-amber-400 rounded-full animate-spin mb-2"></div>
            <p class="text-xs text-amber-200">جاري تجهيز لوحة القص...</p>
          </div>
        }

        @if (errorMessage()) {
          <div class="absolute top-3 inset-x-4 z-30 p-2.5 rounded-lg bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs flex items-center gap-2">
            <app-icon name="alert-triangle" [size]="16" />
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <div class="cropper-image-container w-full h-full flex items-center justify-center p-2">
          <img
            #cropperImage
            [src]="imageSrcUrl()"
            alt="Source for math question cropping"
            class="max-w-full max-h-full block opacity-0 transition-opacity"
            [class.opacity-100]="isCropperReady()"
          />
        </div>
      </main>

      <!-- Modal Footer -->
      <footer class="flex items-center justify-between px-5 py-3 bg-slate-950/80 border-t border-amber-500/20">
        <div class="text-[11px] text-slate-400 hidden sm:block">
          * يتم ضغط الصورة تلقائياً بصيغة WebP خفيفة (أقل من 150KB) لسرعة تحميل فائقة للطلاب.
        </div>

        <div class="flex items-center gap-2.5 mr-auto">
          <button
            type="button"
            (click)="cancelCrop()"
            [disabled]="isSaving()"
            class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition-colors disabled:opacity-50"
          >
            إلغاء
          </button>

          <button
            type="button"
            (click)="saveCrop()"
            [disabled]="!isCropperReady() || isSaving()"
            class="px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs transition-all shadow-lg shadow-amber-500/20 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
          >
            @if (isSaving()) {
              <div class="w-3.5 h-3.5 border-2 border-slate-950/40 border-t-slate-950 rounded-full animate-spin"></div>
              <span>جاري الحفظ والرفع...</span>
            } @else {
              <app-icon name="check" [size]="16" />
              <span>حفظ وتأكيد القصاصة</span>
            }
          </button>
        </div>
      </footer>
    </div>
  </div>
}
