<div class="protected-pdf-wrapper w-full rounded-3xl border border-surface-border bg-surface-card overflow-hidden shadow-card flex flex-col">
  
  <!-- PDF Header Toolbar -->
  <div class="pdf-toolbar px-4 py-3 bg-surface-bg border-b border-surface-border flex flex-wrap items-center justify-between gap-3 select-none">
    
    <!-- Title -->
    <div class="flex items-center gap-2">
      <app-icon name="file-text" [size]="18" className="text-brand-primary dark:text-brand-accent" />
      <h3 class="text-xs sm:text-sm font-bold text-text-primary truncate max-w-xs sm:max-w-md">
        {{ documentTitle() }}
      </h3>
    </div>

    <!-- Page Controls & Zoom Controls -->
    <div class="flex items-center gap-2 sm:gap-4">
      
      <!-- Page Navigation -->
      <div class="flex items-center gap-1.5 bg-surface-card border border-surface-border rounded-xl px-2 py-1 text-xs font-numeric font-bold">
        <button
          type="button"
          (click)="prevPage()"
          [disabled]="currentPage() <= 1"
          class="p-1 rounded hover:bg-surface-bg disabled:opacity-40 transition-colors"
          aria-label="Previous Page"
        >
          <app-icon name="chevron-left" [size]="14" />
        </button>

        <span class="text-text-primary px-1">
          {{ currentPage() }} / {{ totalPages() }}
        </span>

        <button
          type="button"
          (click)="nextPage()"
          [disabled]="currentPage() >= totalPages()"
          class="p-1 rounded hover:bg-surface-bg disabled:opacity-40 transition-colors"
          aria-label="Next Page"
        >
          <app-icon name="chevron-right" [size]="14" />
        </button>
      </div>

      <!-- Zoom Controls -->
      <div class="flex items-center gap-1 bg-surface-card border border-surface-border rounded-xl px-2 py-1 text-xs font-numeric font-bold">
        <button
          type="button"
          (click)="zoomOut()"
          [disabled]="zoomScale() <= 0.75"
          class="p-1 rounded hover:bg-surface-bg disabled:opacity-40 transition-colors"
          title="Zoom Out"
        >
          -
        </button>
        <span class="text-text-muted px-1">{{ (zoomScale() * 100) }}%</span>
        <button
          type="button"
          (click)="zoomIn()"
          [disabled]="zoomScale() >= 2.5"
          class="p-1 rounded hover:bg-surface-bg disabled:opacity-40 transition-colors"
          title="Zoom In"
        >
          +
        </button>
      </div>

      <!-- Print Button with Conditional Gating -->
      <button
        type="button"
        (click)="printDocument()"
        [disabled]="isPrinting() || !isPrintAllowed()"
        class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5"
        [ngClass]="{
          'bg-brand-primary text-white hover:bg-brand-primary-hover shadow-sm cursor-pointer': isPrintAllowed() && !isPrinting(),
          'bg-brand-primary/80 text-white cursor-wait animate-pulse': isPrinting(),
          'bg-surface-card border border-surface-border text-text-muted opacity-60 cursor-not-allowed': !isPrintAllowed()
        }"
        [title]="isPrintAllowed() ? 'طباعة المذكرة مع العلامة المائية' : 'الطباعة غير مصرح بها لهذا الملف'"
      >
        @if (isPrinting()) {
          <app-icon name="refresh" [size]="13" className="animate-spin text-white" />
          <span class="font-numeric">
            جاري التجهيز ({{ printProgress()?.current }} / {{ printProgress()?.total }})...
          </span>
        } @else {
          <app-icon [name]="isPrintAllowed() ? 'award' : 'lock'" [size]="14" />
          <span class="hidden sm:inline">
            {{ isPrintAllowed() ? 'طباعة مصرح بها' : 'الطباعة مقفلة' }}
          </span>
        }
      </button>
    </div>
  </div>

  <!-- PDF Canvas Viewport with appPreventContextCopy -->
  <div
    class="pdf-canvas-container relative flex-1 p-4 sm:p-8 overflow-auto flex items-center justify-center bg-surface-secondary/40 min-h-[500px]"
    appPreventContextCopy
  >
    @if (isLoading()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-surface-card/80 backdrop-blur-sm z-10">
        <app-icon name="refresh" [size]="32" className="animate-spin text-brand-primary" />
        <span class="text-xs font-bold text-text-muted">
          جاري فك تشفير وتجهيز صفحات المستند...
        </span>
      </div>
    } @else if (errorMessage()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-surface-card p-6 text-center z-10">
        <div class="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-500 flex items-center justify-center mb-1">
          <app-icon name="alert-circle" [size]="24" />
        </div>
        <p dir="rtl" class="text-xs sm:text-sm font-bold text-text-primary max-w-md leading-relaxed text-center">
          {{ errorMessage() }}
        </p>
        <button
          type="button"
          (click)="retryLoad()"
          class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-brand-primary hover:bg-brand-primary-hover shadow-sm transition-all cursor-pointer flex items-center gap-2 mt-2"
        >
          <app-icon name="refresh" [size]="14" />
          <span>إعادة المحاولة</span>
        </button>
      </div>
    }

    <!-- HTML5 Native Canvas Page -->
    <div class="canvas-sheet shadow-2xl rounded-lg overflow-hidden border border-surface-border bg-white" [class.hidden]="errorMessage()">
      <canvas #pdfCanvas class="block max-w-full h-auto"></canvas>
    </div>
  </div>

</div>
