<div
  #playerContainer
  (mousemove)="onMouseMove()"
  class="protected-player-tablet-casing relative w-full aspect-video select-none group"
  appPreventContextCopy
>
  <!-- Ambient Backlight Glow around the frame edges (matching mockup) -->
  <div class="player-ambient-backlight" aria-hidden="true"></div>

  <!-- Inner Glass Bezel Screen Frame -->
  <div class="player-screen-chassis relative w-full h-full rounded-[24px] overflow-hidden bg-[#0A0D18]">
    <!-- 1. YouTube IFrame Mount Target (Rendered by YouTube IFrame API) -->
    <div class="absolute inset-0 w-full h-full pointer-events-none">
      <div #iframeMount class="w-full h-full"></div>
    </div>

    <!-- 1.1 Facade Poster Thumbnail (Ensures zero third-party cookies on initial landing) -->
    @if (!hasStarted() && thumbnailUrl()) {
      <div
        class="absolute inset-0 w-full h-full z-10 transition-transform duration-700 pointer-events-none"
      >
        <img
          [src]="thumbnailUrl()"
          alt=""
          width="480"
          height="270"
          loading="lazy"
          decoding="async"
          class="w-full h-full object-cover"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-[#0A0D18]/90 via-[#0A0D18]/40 to-transparent"></div>
      </div>
    }

    <!-- 2. Transparent Security Shield Overlay (z-layer-shield: 20) -->
    <!-- Blocks context menu, title clicks, and share button from YouTube iframe -->
    <div
      (click)="togglePlay()"
      class="yt-security-shield absolute inset-0 z-layer-shield cursor-pointer bg-transparent"
      title="Spider Math DRM Security Shield"
    ></div>

    <!-- 3. Dynamic Anti-Tamper Watermark Component (z-layer-watermark: 25) -->
    @if (!isPublicHeroPromo()) {
      <app-anti-tamper-watermark
        [watermarkText]="watermarkText()"
        [intervalSeconds]="7"
        (tamperDetected)="onTamperDetected($event)"
      />
    }

    <!-- 4. Gamification 85% Threshold Celebration Pop-up (Animation 4.4) -->
    @if (!isPublicHeroPromo() && isCelebrationVisible()) {
      <div class="xp-celebration-popup absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 z-layer-modal pointer-events-none text-center">
        <div class="inline-flex items-center gap-3 px-6 py-3 rounded-2xl btn-gold-metallic shadow-gold-glow font-black text-sm sm:text-base border border-white/30 backdrop-blur-md">
          <span class="text-xl animate-spark-twinkle">✦</span>
          <span>{{ langService.isArabic() ? '+50 XP ✦ أحسنت! أتممت نسبة 85% من المحاضرة بنجاح' : '+50 XP ✦ Great job! Completed 85% of lecture' }}</span>
        </div>
      </div>
    }

    <!-- 6. Custom Video Controls & Scrubber (Simplified Minimal Interface) -->
    <div
      class="player-controls-bar absolute inset-x-0 bottom-0 z-layer-player-controls px-4 sm:px-5 py-3 sm:py-4 bg-gradient-to-t from-black/90 via-black/50 to-transparent transition-opacity duration-300"
      [ngClass]="{ 'opacity-100': showControls() || !isPlaying(), 'opacity-0 pointer-events-none': !showControls() && isPlaying() }"
    >
      <!-- Sleek Horizontal Scrubber -->
      <div
        (click)="seek($event)"
        class="relative w-full h-4 flex items-center cursor-pointer mb-2 sm:mb-3 group/seek"
        [title]="langService.isArabic() ? 'انقر للتقديم أو التأخير' : 'Click to seek'"
      >
        <!-- Background Track -->
        <div class="w-full h-1 sm:h-1.5 rounded-full bg-white/20 relative">
          <!-- Watched Progress Fill -->
          <div
            class="h-full rounded-full bg-gradient-to-r from-[#C49A45] via-[#E5C47E] to-[#F5D77F] relative shadow-[0_0_8px_rgba(229,196,126,0.6)]"
            [style.width]="progressPercentage() + '%'"
          >
            <!-- Glowing Spherical Head / Thumb -->
            <div class="scrubber-thumb-orb absolute right-0 rtl:right-auto rtl:left-0 top-1/2 -translate-y-1/2 translate-x-1/2 rtl:-translate-x-1/2"></div>
          </div>
        </div>
      </div>

      <!-- Controls Row: Play/Pause and Audio Toggle -->
      <div class="flex items-center text-white text-xs gap-3 font-semibold">
        <!-- Play / Pause Button -->
        <button
          type="button"
          (click)="togglePlay()"
          class="p-2 rounded-xl hover:bg-white/15 transition-colors cursor-pointer"
          [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
        >
          @if (isPlaying()) {
            <span class="w-4 h-4 flex items-center justify-center font-bold">❚❚</span>
          } @else {
            <app-icon name="play" [size]="16" />
          }
        </button>

        <!-- Audio Icon Button (Toggles Mute) -->
        <button
          type="button"
          (click)="toggleMute()"
          [attr.aria-label]="isMuted() || volume() === 0 ? 'Unmute sound' : 'Mute sound'"
          class="p-2 rounded-xl hover:bg-white/15 transition-colors cursor-pointer"
        >
          <app-icon [name]="isMuted() || volume() === 0 ? 'volume-x' : 'volume-2'" [size]="16" />
        </button>
      </div>
    </div>
  </div>
</div>
