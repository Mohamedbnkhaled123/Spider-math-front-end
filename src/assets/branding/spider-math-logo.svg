<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="spiderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#spiderGrad)"/>
  <!-- Web Math Coordinates Grid -->
  <line x1="100" y1="20" x2="100" y2="180" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2"/>
  <!-- Spider Body & Math Symbol -->
  <circle cx="100" cy="100" r="24" fill="#ffffff"/>
  <text x="100" y="108" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">∑</text>
  <!-- Spider Legs / Vectors -->
  <path d="M 80 85 Q 50 60 40 75" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 80 95 Q 45 90 35 105" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 80 105 Q 45 120 40 135" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 80 115 Q 55 145 50 160" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <path d="M 120 85 Q 150 60 160 75" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120 95 Q 155 90 165 105" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120 105 Q 155 120 160 135" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120 115 Q 145 145 150 160" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
